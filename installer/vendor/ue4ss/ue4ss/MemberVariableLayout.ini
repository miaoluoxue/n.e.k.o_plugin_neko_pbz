; ============================================================================
; Phantom Blade Zero - UE4SS member layout override
; Build: UE 5.7.4-301152+e7c521b094c0 custom engine fork (CL-301152)
;
; Regenerate after every game update:
;   Dumper-7 (see D:\trainer-re\pb\dumper7\) -> Dumpspace\OffsetsInfo.json
;   -> verify with tools\check-usmap.py against a reference .usmap
;
; Install: copy this file into the UE4SS working directory (next to
;          UE4SS.dll, e.g. <game>/platform/steam/ue4ss/MemberVariableLayout.ini).
;          A copy lives in the repo under assets/CustomGameConfigs/Phantom Blade Zero/.
;
; ---------------------------------------------------------------------------
; What is non-standard in this engine fork (measured on the live CL-301152
; process, cross-checked against the CL-301152 Dumper-7 dump):
;
;   1. UStruct carries a case-sensitive field-name map (TMap<FName, FString>)
;      inserted after ChildProperties:
;        - PropertiesSize shifts to 0xA0, MinAlignment to 0xAC
;        - this propagates into all UStruct-derived classes (UClass/UFunction)
;      Unchanged since CL-292403 - the CL-301152 dump reports the same values.
;
;   2. FField::Next and FField::Owner are swapped: Next is at 0x10 and Owner at
;      0x18 (low bit used as a tag), the reverse of stock UE 5.7. The rest of
;      FField is stock. This must be overridden here - UE4SS walks the property
;      chain during startup and crashes on the garbage node otherwise.
;
;   2b. FFieldClass is reordered as well (see the section comment below). Without
;      it, every property type name resolves to "None", the type checker finds
;      nothing, and startup aborts on the FText size probe.
;
;   3. TUObjectArray (the sub-object Dumper-7 reports as GObjects) puts the
;      chunk counters first:
;        +0x00 MaxChunks, +0x04 NumChunks, +0x08 Objects,
;        +0x10 NumElements, +0x14 MaxElements
;      Measured: NumElements=371762, MaxElements=4259840, MaxChunks=65,
;      NumChunks=6, 0x10000 elements per chunk.
;
;   4. FUObjectItem needs no override: UE4SS 5.7 defaults already match this
;      build (FlagsAndRefCount +0x00, Object +0x08, SerialNumber +0x10,
;      size 0x18). Verified on the live process: item[0] carries
;      0x4000000000000000 (RootSet in the high 32 bits) and Object at +0x08.
;
;   5. GObjects is not where patternsleuth expects it, and its AOB scan fails
;      on this build. A manual signature is required at
;          <ue4ss working dir>/UE4SS_Signatures/GUObjectArray.lua
;      The script returns TUObjectArray::Objects minus 0x08 so that, with
;      ObjObjects = 0x00 below, the TUObjectArray is overlaid at the
;      GUObjectArray base. Because the base is therefore not the real head of
;      FUObjectArray, the listener arrays (which follow ObjObjects inside
;      FUObjectArray) are at unmeasured addresses - hence bDisableListeners.
;
; Keep bUseUObjectArrayCache = false in UE4SS-settings.ini as well; the
; listener-based object cache depends on those same listener arrays.
; ============================================================================

[UStruct]
PropertiesSize = 0xA0
MinAlignment = 0xAC
StructStateFlags = 0xAE
Script = 0xB0
PropertyLink = 0xC0
RefLink = 0xC8
DestructorLink = 0xD0
PostConstructLink = 0xD8
ScriptAndPropertyObjectReferences = 0xE0
UnresolvedScriptProperties = 0xF0
UEP_TotalSize = 0x100

[UClass]
ClassConstructor = 0x100
ClassVTableHelperCtorCaller = 0x108
ClassUnique = 0x118
FirstOwnedClassRep = 0x11C
bCooked = 0x120
bLayoutChanging = 0x121
ClassFlags = 0x124
ClassCastFlags = 0x128
ClassWithin = 0x130
ClassConfigName = 0x138
NetFields = 0x150
ClassDefaultObject = 0x160
SparseClassData = 0x168
SparseClassDataStruct = 0x170
bNeedsDynamicSubobjectInstancing = 0x178
FuncMap = 0x180
FuncMapLock = 0x1D0
AllFunctionsCache = 0x1D8
AllFunctionsCacheLock = 0x228
Interfaces = 0x230
ReferenceSchema = 0x240
NativeFunctionLookupTable = 0x248
UEP_TotalSize = 0x258

[UFunction]
FunctionFlags = 0x100
NumParms = 0x104
ParmsSize = 0x106
ReturnValueOffset = 0x108
RPCId = 0x10A
RPCResponseId = 0x10C
FirstPropertyToInit = 0x110
EventGraphFunction = 0x118
EventGraphCallOffset = 0x120
Func = 0x128
UEP_TotalSize = 0x130

[UEnum]
Names = 0x48

; FField::Next and FField::Owner are SWAPPED relative to stock UE 5.7:
;   stock:  Owner +0x10, Next +0x18
;   this:   Next  +0x10, Owner +0x18 (Owner is tagged, low bit = UObject)
; Reading stock offsets makes Next return the tagged owner pointer, so the
; property chain walks into garbage one node later. UE4SS then crashes in
; TypeChecker at the first FFieldClass::GetFName() of that bogus node.
; Everything else in FField is stock - confirmed because the FProperty
; member offsets that follow it (ArrayDim 0x30, ElementSize 0x34,
; PropertyFlags 0x38, Offset_Internal 0x44) match the 5.7 defaults exactly.
[FField]
ClassPrivate = 0x08
Next = 0x10
Owner = 0x18
NamePrivate = 0x20
FlagsPrivate = 0x28
UEP_TotalSize = 0x30

; FFieldClass is reordered too: ConstructFn moved to the front and the FName
; moved to the end, with CastFlags before ClassFlags. Verified by decoding the
; live name pool: the qword at +0x30 resolves to "ArrayProperty", "BoolProperty",
; "StructProperty", ... for the classes whose CastFlags are 0x208001, 0x28001,
; 0x108001. At +0x00 sits a code pointer (the per-type construct function), so
; leaving the stock 0x00 makes every property type resolve to "None" and
; aborts startup with "[FText::StaticSize] StaticSize_Private is not valid".
[FFieldClass]
ConstructFn = 0x00
Id = 0x08
CastFlags = 0x10
ClassFlags = 0x18
SuperClass = 0x20
DefaultObject = 0x28
FName = 0x30
UniqueNameIndexCounter = 0x38
UEP_TotalSize = 0x40

; The GUObjectArray locator returns the real head of FUObjectArray, which sits
; 0x10 bytes before the TUObjectArray member it embeds. All fields below were
; read out of the live process of CL-301152 and cross-checked for consistency:
;   ObjFirstGCIndex 51971 == ObjLastNonGCIndex 51970 + 1 == MaxObjectsNotConsideredByGC 51971
;   OpenForDisregardForGC == 0 (the pre-GC pool is closed)
;   both listener slots hold well-formed TArrays (create {2/4}, delete {9/22})
;   bShouldRecycleObjectIndices == 1
; This layout is unchanged from CL-292403, where listeners already worked.
[FUObjectArray]
ObjFirstGCIndex = 0x00
ObjLastNonGCIndex = 0x04
MaxObjectsNotConsideredByGC = 0x08
OpenForDisregardForGC = 0x0C
ObjObjects = 0x10
UObjectCreateListeners = 0x70
UObjectDeleteListeners = 0xA8
PrimarySerialNumber = 0xE0
bShouldRecycleObjectIndices = 0xE4
UEP_TotalSize = 0xE8

[TUObjectArray]
MaxChunks = 0x00
NumChunks = 0x04
Objects = 0x08
NumElements = 0x10
MaxElements = 0x14
UEP_TotalSize = 0x18
