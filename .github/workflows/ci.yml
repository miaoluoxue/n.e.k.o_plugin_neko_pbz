name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test tools
        run: python -m pip install --disable-pip-version-check ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --basetemp=.ci-pytest

      - name: Check JavaScript
        run: |
          node --check game_bundle/mod/js/pbz-neko-companion/game_api.js
          node --check game_bundle/mod/js/pbz-neko-companion/main.js
          node --check game_bundle/mod/js/pbz-neko-companion/ui_bridge.js
          node tests/test_game_api_equipment.js
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('static/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);new vm.Script(m[1]);"
